<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Univers Bridal · Liens</title>
  <meta name="description" content="Univers Bridal — robes de mariée. Retrouvez-nous sur Instagram, TikTok, Facebook et contactez-nous directement sur WhatsApp.">
  <meta name="theme-color" content="#000000">
  <link rel="canonical" href="https://links.universbridal.com/">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Aperçu quand le lien est partagé (WhatsApp, Instagram, Facebook…) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://links.universbridal.com/">
  <meta property="og:title" content="Univers Bridal · Wedding Dress">
  <meta property="og:description" content="Nos réseaux et un contact direct sur WhatsApp.">
  <meta property="og:image" content="https://links.universbridal.com/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000000;
      --card: #0E0C09;
      --card-hover: #16120C;
      --ink: #F6EEDF;
      --muted: #A8997F;
      --gold: #E3AE45;
      --gold-light: #F7D27E;
      --gold-deep: #B9832A;
      --line: rgba(227, 174, 69, .28);
      --gold-grad: linear-gradient(135deg, #F7D27E 0%, #E3AE45 45%, #B9832A 100%);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { background: var(--bg); }
    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Jost", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: max(28px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    /* Paillettes dorées discrètes */
    #sparkles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
    main { position: relative; z-index: 1; width: 100%; max-width: 460px; display: flex; flex-direction: column; align-items: center; }

    /* --- En-tête --- */
    .logo {
      width: min(250px, 68vw); height: auto; aspect-ratio: 1;
      display: block; margin: -10px 0 -18px;
      /* fond noir du logo fondu dans la page */
      -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 71%);
              mask-image: radial-gradient(circle, #000 62%, transparent 71%);
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .kicker {
      margin: 2px 0 10px;
      font-family: "Cormorant Garamond", serif; font-weight: 500;
      font-size: 13px; letter-spacing: .42em; text-indent: .42em; text-transform: uppercase;
      color: var(--gold);
    }
    .tagline {
      margin: 0; color: var(--muted); font-size: 15px; text-align: center;
      line-height: 1.5; max-width: 34ch;
    }
    .divider {
      display: flex; align-items: center; gap: 12px; color: var(--gold);
      margin: 24px 0 22px; width: 60%; font-size: 12px;
    }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
    .divider::after { transform: scaleX(-1); }

    /* --- Boutons --- */
    .links { list-style: none; padding: 0; margin: 0; width: 100%; display: grid; gap: 12px; }
    .btn {
      display: flex; align-items: center; gap: 14px;
      min-height: 62px; padding: 12px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      color: var(--ink); text-decoration: none;
      font-size: 16px; font-weight: 500; letter-spacing: .02em;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .btn:hover {
      transform: translateY(-2px); background: var(--card-hover); border-color: var(--gold);
      box-shadow: 0 0 0 1px rgba(227,174,69,.15), 0 12px 30px -16px rgba(227, 174, 69, .55);
    }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
    .btn .ico { width: 24px; height: 24px; flex: none; color: var(--gold); }
    .btn .label { flex: 1; }
    .btn .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 1px; letter-spacing: .01em; }
    .btn .arrow { width: 18px; height: 18px; color: var(--line); flex: none; transition: color .18s, transform .18s; }
    .btn:hover .arrow { color: var(--gold); transform: translateX(2px); }

    /* Bouton WhatsApp : or plein */
    .btn.primary { background: var(--gold-grad); border-color: transparent; color: #1A1206; }
    .btn.primary .ico, .btn.primary .arrow { color: #1A1206; }
    .btn.primary .sub { color: rgba(26, 18, 6, .72); }
    .btn.primary:hover { background: var(--gold-grad); filter: brightness(1.06); border-color: transparent; box-shadow: 0 14px 34px -14px rgba(227, 174, 69, .75); }

    footer { margin-top: 36px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: color .18s; }
    footer a:hover { color: var(--gold); }

    @media (prefers-reduced-motion: reduce) { .btn, .btn .arrow { transition: none; } }
  </style>
</head>
<body>
  <canvas id="sparkles" aria-hidden="true"></canvas>
  <main>
    <img class="logo" src="logo.png" alt="Univers Bridal — Wedding Dress" width="512" height="512">
    <h1 class="sr-only" id="name">Univers Bridal</h1>
    <p class="tagline" id="tagline"></p>
    <div class="divider" aria-hidden="true">✦</div>

    <ul class="links" id="links"></ul>

  </main>

  <script>
    /* Paillettes dorées (légères, figées si l'utilisateur limite les animations) */
    (() => {
      const c = document.getElementById("sparkles"), ctx = c.getContext("2d");
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let W, H, dots = [];
      const resize = () => {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth; H = innerHeight;
        c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = Math.round(W * H / 9000);
        dots = Array.from({ length: n }, () => ({
          x: Math.random() * W, y: Math.random() * H,
          r: Math.random() * 1.3 + .3, a: Math.random() * .5 + .1,
          s: Math.random() * .015 + .004, p: Math.random() * Math.PI * 2,
        }));
      };
      const draw = t => {
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          const tw = still ? 1 : .55 + .45 * Math.sin(d.p + t * d.s * .06);
          ctx.globalAlpha = d.a * tw;
          ctx.fillStyle = "#E3AE45";
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        }
        if (!still) requestAnimationFrame(draw);
      };
      addEventListener("resize", () => { resize(); if (still) draw(0); });
      resize(); requestAnimationFrame(draw);
    })();
  </script>

  <script>
    /* =====================================================================
       ✏️  À MODIFIER — tout se règle ici
       ===================================================================== */
    const PROFILE = {
      name: "Univers Bridal",
      tagline: "Robes de mariée & accessoires — sublimer votre plus beau jour.",

      whatsapp: {
        // Numéro au format international, chiffres uniquement, sans + ni 0 initial
        // ex. France 06 12 34 56 78  →  "33612345678"
        number: "33774858061",
        // Message pré-rempli quand la personne ouvre la conversation
        message: "Bonjour Univers Bridal, je souhaiterais avoir des informations.",
        label: "Cliquer pour prendre rendez‑vous", // ‑ = tiret insécable
        sub: "Réponse rapide sur WhatsApp",
      },

      // Supprimez une ligne pour cacher un réseau, changez l'ordre comme vous voulez
      links: [
        { icon: "instagram", label: "Instagram", sub: "@univers.bridal",   url: "https://www.instagram.com/univers.bridal/" },
        { icon: "tiktok",    label: "TikTok",    sub: "@bridal.glory",     url: "https://www.tiktok.com/@univers.bridal" },
        { icon: "facebook",  label: "Facebook",  sub: "Univers Bridal",    url: "https://www.facebook.com/profile.php?id=61550023395044" },
        { icon: "globe",     label: "Site web",  sub: "universbridal.com", url: "https://universbridal.com/" },
      ],
    };
    /* ===================================================================== */

    const ICONS = {
      whatsapp: '<path d="M3.5 20.5l1.3-4.3A8.5 8.5 0 1 1 8 19.4z"/><path d="M9.2 8.3c-.3 3.2 3.3 6.8 6.5 6.5l.9-1.4-2-1.1-.9.7c-1-.4-2-1.4-2.4-2.4l.7-.9-1.1-2z" fill="currentColor" stroke="none"/>',
      instagram: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/>',
      tiktok: '<path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.7 2.3 4.5 5 4.7"/>',
      facebook: '<path d="M14.5 21v-7.5h2.7l.4-3.1h-3.1V8.6c0-.9.3-1.5 1.6-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.1H9v3.1h2.5V21"/>',
      pinterest: '<circle cx="12" cy="12" r="9"/><path d="M11 13.2 9.4 20"/><path d="M8.6 12.6c-.8-3.2 1.4-5.8 4.3-5.8 2.6 0 4 1.8 4 3.9 0 2.6-1.4 4.6-3.3 4.6-1.4 0-2.3-1.1-2-2.4l.6-2.5"/>',
      youtube: '<rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>',
      globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
      mail: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/>',
    };
    const svg = (name, cls) =>
      `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ICONS.globe}</svg>`;
    const arrow = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function item({ icon, label, sub, url }, primary = false) {
      return `<li><a class="btn${primary ? " primary" : ""}" href="${esc(url)}" target="_blank" rel="noopener">
        ${svg(icon, "ico")}
        <span class="label">${esc(label)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span>
        ${arrow}
      </a></li>`;
    }

    document.getElementById("name").textContent = PROFILE.name;
    document.getElementById("tagline").textContent = PROFILE.tagline;

    const wa = PROFILE.whatsapp;
    const waUrl = `https://wa.me/${wa.number.replace(/\D/g, "")}?text=${encodeURIComponent(wa.message)}`;

    document.getElementById("links").innerHTML =
      item({ icon: "whatsapp", label: wa.label, sub: wa.sub, url: waUrl }, true) +
      PROFILE.links.map(l => item(l)).join("");
  </script>
</body>
</html>
